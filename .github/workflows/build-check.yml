# TEMPORARY - build, tests and demo e2e for feat/maintenance-log; branch ci/build-check is deleted afterwards.
name: build-check
on:
  push:
    branches: [ci/build-check]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, 'e2e results')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: report helper
        run: |
          cat > /tmp/report.sh <<'EOS'
          #!/usr/bin/env bash
          msg=$(tail -n "${4:-40}" "$3" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::$1 title=$2::${msg}"
          EOS
          chmod +x /tmp/report.sh
      - name: install (bun.lock)
        run: bun install --frozen-lockfile > install.log 2>&1 || { /tmp/report.sh error "install" install.log; exit 1; }
      - name: npm run build
        run: |
          if npm run build > build.log 2>&1; then /tmp/report.sh notice "npm run build OK" build.log 3
          else /tmp/report.sh error "npm run build FAILED" build.log 60; exit 1; fi
      - name: npm test
        run: |
          if npm test > test.log 2>&1; then /tmp/report.sh notice "npm test OK" test.log 6
          else /tmp/report.sh error "npm test FAILED" test.log 80; exit 1; fi
      - name: tsc
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.json > tsc.log 2>&1; code=$?
          echo "exit $code, $(grep -c 'error TS' tsc.log) errors" >> tsc.log
          /tmp/report.sh notice "tsc" tsc.log 25
          exit $code
      - name: playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium > /tmp/pw/install.log 2>&1 || { /tmp/report.sh error "playwright install" /tmp/pw/install.log 30; exit 1; }
      - name: start app server (vite dev)
        run: |
          nohup npx vite dev --port 4173 --strictPort > server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          curl -s http://localhost:4173/twin >/dev/null; curl -s http://localhost:4173/review >/dev/null
      - name: e2e
        run: |
          set +e
          export PW=/tmp/pw/node_modules/playwright/index.mjs BASE=http://localhost:4173
          node e2e/demo.e2e.mjs > e2e-demo.log 2>&1; c1=$?
          node e2e/review-twin.e2e.mjs > e2e-review.log 2>&1; c2=$?
          /tmp/report.sh notice "maintenance demo e2e (exit $c1)" e2e-demo.log 30
          /tmp/report.sh notice "review -> twin e2e (exit $c2)" e2e-review.log 45
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -f e2e-out && git commit -qm "TEMP: e2e results" && git push -q origin HEAD:ci/build-check
          [ $c1 -eq 0 ] && [ $c2 -eq 0 ]
