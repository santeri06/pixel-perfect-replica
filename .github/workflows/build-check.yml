# TEMPORARY - verifies feat/maintenance-log builds; this branch is deleted after the run.
name: build-check
on:
  push:
    branches: [ci/build-check]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (bun, frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Test (vitest)
        run: bun run test
      - name: Typecheck (informational)
        run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true
      - name: Lint (informational)
        run: bun run lint
        continue-on-error: true
