# TEMPORARY - demo e2e against the production build; branch ci/build-check is deleted afterwards.
name: build-check
on:
  push:
    branches: [ci/build-check]
permissions:
  contents: write
jobs:
  demo-e2e:
    if: "!contains(github.event.head_commit.message, 'e2e results')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: report helper
        run: |
          cat > /tmp/report.sh <<'EOS'
          #!/usr/bin/env bash
          msg=$(tail -n "${4:-40}" "$3" | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::$1 title=$2::${msg}"
          EOS
          chmod +x /tmp/report.sh
      - run: bun install --frozen-lockfile
      - name: npm run build
        run: npm run build > build.log 2>&1 || { /tmp/report.sh error "build" build.log 60; exit 1; }
      - name: playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium > /tmp/pw/install.log 2>&1 || { /tmp/report.sh error "playwright install" /tmp/pw/install.log 30; exit 1; }
      - name: start preview server
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          curl -s -o /dev/null -w "root %{http_code}\n" http://localhost:4173/ > probe.log
          curl -s -o /dev/null -w "twin %{http_code}\n" http://localhost:4173/twin >> probe.log
          curl -s -o /dev/null -w "field %{http_code}\n" http://localhost:4173/field/index.html >> probe.log
          curl -s -o /dev/null -w "field-dir %{http_code}\n" http://localhost:4173/field/ >> probe.log
          curl -s -o /dev/null -w "registry %{http_code}\n" http://localhost:4173/field/registry.json >> probe.log
          /tmp/report.sh notice "preview probe" probe.log 10
      - name: demo e2e
        run: |
          set +e
          PW=/tmp/pw/node_modules/playwright/index.mjs BASE=http://localhost:4173 node e2e/demo.e2e.mjs > e2e.log 2>&1; code=$?
          /tmp/report.sh notice "demo e2e (exit $code)" e2e.log 30
          tail -n 30 preview.log > e2e-out/preview-tail.log 2>/dev/null || true
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -f e2e-out && git commit -qm "TEMP: e2e results" && git push -q origin HEAD:ci/build-check
          exit $code
