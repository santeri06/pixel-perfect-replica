<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f2a44" />
<title>VEO360 Field</title>
<!--
  VEO360 Field App - standalone maintenance app for technicians.
  Architecturally separate from AutoTag: no shared code, one file, no build step.
  It talks to AutoTag only through a data contract:
    - device register:   GET registry.json (same folder; generated by scripts/build-registry.mjs)
    - maintenance log:   localStorage["veo.maintenance.v1"] = { schema: 1, seedVersion, entries[] }
                          (local demo mode: same browser + same origin as AutoTag)
  API mode (/api/v1, P0-5...P0-7) will replace the localStorage calls in store.* only.
-->
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1f2a44; --muted:#6b7280; --line:#e5e7eb; --primary:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --r:12px; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:5; background:var(--fg); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header button { background:transparent; color:#fff; border:1px solid #ffffff55; border-radius:8px; padding:6px 10px; font-size:14px; }
  main { max-width:640px; margin:0 auto; padding:12px 16px 96px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#e0e7ff; color:#3730a3; }
  .demo { background:#fef3c7; color:#92400e; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:10px 0; }
  .row { display:block; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; }
  .row:active { background:#eef2ff; }
  .title { font-weight:600; }
  .muted { color:var(--muted); font-size:14px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:6px; margin-left:4px; vertical-align:middle; }
  .b-ok { background:#dcfce7; color:#166534; } .b-warn { background:#fef3c7; color:#92400e; } .b-bad { background:#fee2e2; color:#991b1b; }
  .chips { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font-size:14px; }
  .chip[aria-pressed="true"] { background:var(--fg); color:#fff; border-color:var(--fg); }
  input, select, textarea { width:100%; font:inherit; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; color:inherit; }
  textarea { min-height:72px; }
  label { display:block; font-size:14px; font-weight:600; margin:12px 0 4px; }
  label.req::after { content:" *"; color:var(--bad); }
  .err { color:var(--bad); font-size:13px; margin-top:4px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:10px 16px; border-radius:10px; border:1px solid var(--primary); background:var(--primary); color:#fff; font:inherit; font-weight:600; text-decoration:none; }
  .btn.sec { background:#fff; color:var(--primary); }
  .btn.small { min-height:36px; padding:6px 12px; font-size:14px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; justify-content:center; }
  .bar .btn { flex:1; max-width:300px; }
  ol.log { list-style:none; padding:0; margin:0; border-left:2px solid #c7d2fe; }
  ol.log li { position:relative; padding:0 0 14px 16px; }
  ol.log li::before { content:""; position:absolute; left:-7px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--primary); }
  ol.log li.open::before { background:var(--warn); }
  dl { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin:8px 0 0; }
  dt { font-size:12px; color:var(--muted); } dd { margin:0; font-weight:500; }
  .confirm { border:2px solid var(--warn); background:#fffbeb; }
  .big { font-size:20px; font-weight:700; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--fg); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; max-width:90vw; z-index:10; }
  #toast a { color:#93c5fd; margin-left:8px; }
  .hidden { display:none !important; }
  #banner { background:#fef3c7; color:#92400e; font-size:13px; text-align:center; padding:6px 12px; }
  #banner b { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1 id="hdr">VEO360 Field</h1>
  <button id="settingsBtn" type="button" aria-label="Settings">Settings</button>
</header>
<div id="banner">Demo mode – data stored in this browser</div>
<main id="app"><p class="muted">Loading device register...</p></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const KEY = "veo.maintenance.v1";
  const NAME_KEY = "veo.performedBy";
  const KINDS = { inspection: "Inspection", secondary_injection_test: "Secondary injection test", trip_test: "Trip test", firmware_update: "Firmware update", settings_change: "Settings change", fault: "Fault notice", repair: "Repair", other: "Other" };
  const STATUS = { open: "Open", in_progress: "In progress", done: "Done" };
  const RESULTS = { ok: "OK", remarks: "Remarks", fault: "Fault" };
  const PERIODIC = ["inspection", "secondary_injection_test", "trip_test"];
  const RESULT_CLS = { ok: "b-ok", remarks: "b-warn", fault: "b-bad" };

  let REG = null; // { instances, seedEntries, seedVersion }

  // localStorage if the browser allows it, otherwise memory (entries are then lost on reload)
  const LS = (() => {
    try {
      localStorage.setItem("veo.probe", "1"); localStorage.removeItem("veo.probe");
      return { ok: true, get: (k) => localStorage.getItem(k), set: (k, v) => localStorage.setItem(k, v) };
    } catch {
      const m = new Map();
      return { ok: false, get: (k) => (m.has(k) ? m.get(k) : null), set: (k, v) => void m.set(k, String(v)) };
    }
  })();
  if (!LS.ok) document.getElementById("banner").innerHTML = "Demo mode – <b>browser storage is blocked: entries are lost when this page is closed</b>";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const today = () => { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
  const addMonths = (date, m) => {
    const [y, mo, d] = date.split("-").map(Number); const t = y * 12 + (mo - 1) + m; const ny = Math.floor(t / 12), nm = (t % 12) + 1;
    const last = new Date(Date.UTC(ny, nm, 0)).getUTCDate(); const p = (n) => String(n).padStart(2, "0"); return `${ny}-${p(nm)}-${p(Math.min(d, last))}`;
  };
  const uuid = () => (crypto && crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === "x" ? r : (r & 3) | 8).toString(16); }));
  const instance = (id) => REG.instances.find((i) => i.id === id);

  // ------------------------------------------------------------ store (local demo mode)
  const store = {
    read() {
      let f = null;
      try { const raw = LS.get(KEY); f = raw ? JSON.parse(raw) : null; } catch { f = null; }
      if (!f || f.schema !== 1 || !Array.isArray(f.entries)) {
        f = { schema: 1, seedVersion: REG.seedVersion, entries: REG.seedEntries.slice() };
        LS.set(KEY, JSON.stringify(f));
      } else if (f.seedVersion !== REG.seedVersion) {
        const ids = new Set(REG.instances.map((i) => i.id));
        // keep recorded and edited entries (an edited demo entry has version > 1)
        const own = f.entries.filter((e) => (e.source !== "seed" || e.version > 1) && ids.has(e.instanceId));
        const ownIds = new Set(own.map((e) => e.id));
        f = { schema: 1, seedVersion: REG.seedVersion, entries: REG.seedEntries.filter((e) => !ownIds.has(e.id)).concat(own) };
        LS.set(KEY, JSON.stringify(f));
      }
      return f;
    },
    entries(instanceId) {
      const key = (e) => e.performedAt || e.createdAt.slice(0, 10);
      return this.read().entries.filter((e) => e.instanceId === instanceId)
        .sort((a, b) => key(b).localeCompare(key(a)) || b.createdAt.localeCompare(a.createdAt));
    },
    save(input, existing) {
      const f = this.read();
      const now = new Date().toISOString();
      if (existing) {
        const cur = f.entries.find((e) => e.id === existing.id);
        if (!cur) throw new Error("This entry no longer exists.");
        if (cur.version !== existing.version) { const err = new Error("conflict"); err.conflict = cur; throw err; }
        const next = { ...cur, ...input, instanceId: cur.instanceId, version: cur.version + 1, updatedAt: now };
        f.entries = f.entries.map((e) => (e.id === cur.id ? next : e));
        LS.set(KEY, JSON.stringify(f));
        return next;
      }
      const entry = { ...input, id: uuid(), version: 1, createdAt: now, updatedAt: now };
      f.entries.push(entry);
      LS.set(KEY, JSON.stringify(f));
      return entry;
    },
    reset() { LS.set(KEY, JSON.stringify({ schema: 1, seedVersion: REG.seedVersion, entries: REG.seedEntries.slice() })); },
  };

  function status(inst) {
    const own = store.entries(inst.id);
    const done = own.filter((e) => e.status === "done");
    let next = (done.find((e) => e.nextDueAt) || {}).nextDueAt || null;
    if (!next && done.length === 0 && inst.commissionedAt && inst.maintenanceIntervalMonths) next = addMonths(inst.commissionedAt, inst.maintenanceIntervalMonths);
    return { next, overdue: !!next && next < today(), open: own.filter((e) => e.status !== "done").length, last: done[0] || null };
  }

  // same rules as src/data/maintenance.schema.ts
  function validate(v) {
    const e = {}, iso = /^\d{4}-\d{2}-\d{2}$/;
    if (!KINDS[v.kind]) e.kind = "Choose the type of work";
    if (!STATUS[v.status]) e.status = "Choose a status";
    if (v.title.trim().length < 3) e.title = "Give a short title";
    if (v.performedBy.trim().length < 2) e.performedBy = "Who did the work?";
    if (v.performedAt && !iso.test(v.performedAt)) e.performedAt = "Use the format YYYY-MM-DD";
    if (v.nextDueAt && !iso.test(v.nextDueAt)) e.nextDueAt = "Use the format YYYY-MM-DD";
    if (v.status === "done" && !v.performedAt) e.performedAt = "Required when the work is done";
    if (v.status === "done" && !v.result) e.result = "Required when the work is done";
    if (v.performedAt && v.performedAt > today()) e.performedAt = "Cannot be in the future";
    if (v.nextDueAt && v.performedAt && v.nextDueAt <= v.performedAt) e.nextDueAt = "Must be after the date of the work";
    return e;
  }

  // ------------------------------------------------------------ routing
  const state = { filter: "all", q: "", form: null };
  const params = () => new URLSearchParams(location.search);
  function go(asset, push = true) {
    const url = asset ? `?asset=${encodeURIComponent(asset)}` : location.pathname;
    if (push) history.pushState({}, "", url);
    state.form = null;
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", () => { state.form = null; render(); });
  // AutoTag (or another tab) saved something: refresh unless a form is being filled in
  window.addEventListener("storage", (e) => { if ((e.key === KEY || e.key === null) && !state.form) render(); });

  let toastTimer;
  function toast(html) {
    const t = document.getElementById("toast");
    t.innerHTML = html; t.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = "none"), 5000);
  }

  // ------------------------------------------------------------ views
  function render() {
    const id = params().get("asset");
    const inst = id ? instance(id) : null;
    document.getElementById("hdr").textContent = inst ? inst.functionalLocation : "VEO360 Field";
    if (id && !inst) { app.innerHTML = `<div class="card"><p class="title">Unknown device</p><p class="muted">${esc(id)} is not in the device register.</p><button class="btn sec" data-go="">All devices</button></div>`; return bind(); }
    if (state.form && inst) return renderForm(inst);
    if (inst) return renderDevice(inst);
    renderList();
  }

  function renderList() {
    const q = state.q.trim().toLowerCase();
    const rows = REG.instances.map((i) => ({ i, s: status(i) }))
      .filter(({ i, s }) => (state.filter === "overdue" ? s.overdue : state.filter === "open" ? s.open > 0 : true))
      .filter(({ i }) => !q || [i.id, i.functionalLocation, i.variant, i.serialNo].join(" ").toLowerCase().includes(q));
    const chip = (k, label) => `<button type="button" class="chip" data-filter="${k}" aria-pressed="${state.filter === k}">${label}</button>`;
    app.innerHTML = `
      <p><span class="pill demo">Example data</span></p>
      <input id="q" type="search" placeholder="Search location, variant or serial number" value="${esc(state.q)}" aria-label="Search devices" />
      <div class="chips">${chip("all", "All")}${chip("overdue", "Overdue")}${chip("open", "Open notices")}</div>
      ${rows.length ? "" : `<p class="muted">No devices match.</p>`}
      ${rows.map(({ i, s }) => `
        <button type="button" class="card row" data-go="${esc(i.id)}">
          <div class="title">${esc(i.functionalLocation)}${s.overdue ? '<span class="badge b-bad">Overdue</span>' : ""}${s.open ? `<span class="badge b-warn">${s.open} open</span>` : ""}</div>
          <div class="muted">${esc(i.variant)} · S/N ${esc(i.serialNo || "-")} · ${esc(i.id)}</div>
          <div class="muted">Last: ${s.last ? `${esc(s.last.performedAt)} ${esc(KINDS[s.last.kind])}` : "no maintenance recorded"} · Next: ${esc(s.next || "not planned")}</div>
        </button>`).join("")}`;
    const qi = document.getElementById("q");
    qi.addEventListener("input", () => { state.q = qi.value; const pos = qi.selectionStart; renderList(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
    bind();
  }

  function entryHtml(e) {
    const badge = e.status !== "done" ? `<span class="badge b-warn">${STATUS[e.status]}</span>` : e.result ? `<span class="badge ${RESULT_CLS[e.result]}">${RESULTS[e.result]}</span>` : "";
    return `<li class="${e.status !== "done" ? "open" : ""}">
      <div class="muted">${esc(e.performedAt || "reported " + e.createdAt.slice(0, 10))} · ${esc(KINDS[e.kind])} ${badge}${e.source === "autotag" ? ' <span class="badge" style="background:#e0e7ff;color:#3730a3">AutoTag</span>' : ""}</div>
      <div class="title">${esc(e.title)}</div>
      ${e.findings ? `<div>${esc(e.findings)}</div>` : ""}
      ${e.actions && e.actions !== "-" ? `<div class="muted">Actions: ${esc(e.actions)}</div>` : ""}
      ${e.firmwareBefore || e.firmwareAfter ? `<div class="muted">Firmware ${esc(e.firmwareBefore || "?")} → ${esc(e.firmwareAfter || "?")}</div>` : ""}
      <div class="muted">${esc(e.performedBy)}${e.company ? " · " + esc(e.company) : ""}${e.nextDueAt ? " · next due " + esc(e.nextDueAt) : ""}</div>
      ${e.status !== "done" ? `<button type="button" class="btn sec small" data-edit="${esc(e.id)}">Update / close</button>` : ""}
    </li>`;
  }

  function renderDevice(inst) {
    const s = status(inst);
    const entries = store.entries(inst.id);
    app.innerHTML = `
      <button type="button" class="btn sec small" data-go="">← All devices</button>
      <div class="card">
        <div class="big">${esc(inst.functionalLocation)}</div>
        <div class="muted">${esc(inst.id)} · ${esc(inst.site)}${inst.isDemo ? ' <span class="pill demo">Example data</span>' : ""}</div>
        <dl>
          <div><dt>Variant</dt><dd>${esc(inst.variant)}</dd></div>
          <div><dt>Serial number</dt><dd>${esc(inst.serialNo || "-")}</dd></div>
          <div><dt>Next maintenance</dt><dd>${esc(s.next || "not planned")}${s.overdue ? '<span class="badge b-bad">Overdue</span>' : ""}</dd></div>
          <div><dt>Open notices</dt><dd>${s.open}</dd></div>
        </dl>
      </div>
      <div class="card">
        <div class="title" style="margin-bottom:10px">Maintenance log</div>
        ${entries.length ? `<ol class="log">${entries.map(entryHtml).join("")}</ol>` : `<p class="muted">No maintenance recorded for this device yet.</p>`}
      </div>
      <div class="bar">
        <button type="button" class="btn sec" data-new="fault">Report fault</button>
        <button type="button" class="btn" data-new="entry">New entry</button>
      </div>`;
    bind(inst);
  }

  function blankForm(preset) {
    const kind = preset === "fault" ? "fault" : "inspection";
    const status = preset === "fault" ? "open" : "done";
    return { kind, status, title: kind === "fault" ? "" : KINDS[kind], performedAt: status === "done" ? today() : "", performedBy: LS.get(NAME_KEY) || "", company: "", findings: "", actions: "", result: "", nextDueAt: "", workPermitRef: "", firmwareBefore: "", firmwareAfter: "" };
  }

  function renderForm(inst) {
    const f = state.form;
    const v = f.values, err = f.errors || {};
    const opt = (map, cur, empty) => (empty ? `<option value="">-</option>` : "") + Object.entries(map).map(([k, l]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${l}</option>`).join("");
    const done = v.status === "done";
    const fld = (name, label, control, req) => `<div><label for="f-${name}" class="${req ? "req" : ""}">${label}</label>${control}${err[name] ? `<div class="err">${esc(err[name])}</div>` : ""}</div>`;
    const inp = (name, type = "text", extra = "") => `<input id="f-${name}" name="${name}" type="${type}" value="${esc(v[name])}" ${extra} />`;
    app.innerHTML = `
      <button type="button" class="btn sec small" data-cancel>← Back</button>
      <form class="card" id="form" novalidate>
        <div class="title">${f.existing ? "Update entry" : v.kind === "fault" ? "Report a fault" : "New maintenance entry"}</div>
        <div class="muted">${esc(inst.functionalLocation)} · ${esc(inst.variant)} · S/N ${esc(inst.serialNo || "-")}</div>
        <div class="grid2">
          ${fld("kind", "Type of work", `<select id="f-kind" name="kind">${opt(KINDS, v.kind)}</select>`, true)}
          ${fld("status", "Status", `<select id="f-status" name="status">${opt(STATUS, v.status)}</select>`, true)}
        </div>
        ${fld("title", "Title", inp("title"), true)}
        <div class="grid2">
          ${fld("performedAt", "Date of work", inp("performedAt", "date", `max="${today()}"`), done)}
          ${fld("result", "Result", `<select id="f-result" name="result">${opt(RESULTS, v.result, true)}</select>`, done)}
        </div>
        <div class="grid2">
          ${fld("performedBy", v.status === "open" ? "Reported by" : "Performed by", inp("performedBy", "text", 'autocomplete="name"'), true)}
          ${fld("company", "Company", inp("company"))}
        </div>
        ${fld("findings", v.kind === "fault" ? "What is wrong?" : "Findings", `<textarea id="f-findings" name="findings">${esc(v.findings)}</textarea>`)}
        ${fld("actions", "Actions taken", `<textarea id="f-actions" name="actions">${esc(v.actions)}</textarea>`)}
        <div class="grid2">
          ${fld("nextDueAt", "Next maintenance due", inp("nextDueAt", "date"))}
          ${fld("workPermitRef", "Work permit ref.", inp("workPermitRef"))}
        </div>
        ${v.kind === "firmware_update" ? `<div class="grid2">${fld("firmwareBefore", "Firmware before", inp("firmwareBefore"))}${fld("firmwareAfter", "Firmware after", inp("firmwareAfter"))}</div>` : ""}
        ${done && !v.nextDueAt && inst.maintenanceIntervalMonths && PERIODIC.includes(v.kind) ? `<p class="muted">Empty due date: set to the date of work + ${inst.maintenanceIntervalMonths} months.</p>` : ""}
        ${f.confirm ? `
          <div class="card confirm" id="confirm">
            <div class="muted">Confirm device</div>
            <div class="big">${esc(inst.functionalLocation)}</div>
            <div>S/N <b>${esc(inst.serialNo || "-")}</b> · ${esc(inst.variant)}</div>
            <p class="muted">Check the rating plate matches before saving.</p>
            <div class="actions"><button type="button" class="btn" data-confirm>Yes, save to this device</button><button type="button" class="btn sec" data-unconfirm>Back</button></div>
          </div>` : `<div class="actions"><button type="submit" class="btn">Save</button><button type="button" class="btn sec" data-cancel>Cancel</button></div>`}
      </form>`;
    const form = document.getElementById("form");
    form.addEventListener("input", (e) => {
      const t = e.target; if (!t.name) return;
      const prevKind = v.kind;
      v[t.name] = t.value;
      if (t.name === "kind" && (v.title === "" || v.title === KINDS[prevKind])) { v.title = t.value === "fault" ? "" : KINDS[t.value]; renderForm(inst); }
      if (t.name === "status") { if (t.value === "done" && !v.performedAt) v.performedAt = today(); renderForm(inst); }
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      f.errors = validate(v);
      f.confirm = Object.keys(f.errors).length === 0;
      renderForm(inst);
      const target = f.confirm ? document.getElementById("confirm") : form.querySelector(".err");
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    bind(inst);
  }

  function toInput(inst, v, existing) {
    const n = (s) => (s && s.trim() ? s.trim() : null);
    const input = {
      instanceId: inst.id, kind: v.kind, status: v.status, title: v.title.trim(), performedAt: n(v.performedAt), performedBy: v.performedBy.trim(),
      company: n(v.company), findings: v.findings, actions: v.actions, result: v.result || null, nextDueAt: n(v.nextDueAt),
      firmwareBefore: n(v.firmwareBefore), firmwareAfter: n(v.firmwareAfter), workPermitRef: n(v.workPermitRef),
      attachments: existing ? existing.attachments : [], source: existing ? existing.source : "field-app",
    };
    if (!input.nextDueAt && input.status === "done" && input.performedAt && PERIODIC.includes(input.kind) && inst.maintenanceIntervalMonths) {
      input.nextDueAt = addMonths(input.performedAt, inst.maintenanceIntervalMonths);
    }
    return input;
  }

  function bind(inst) {
    app.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go || null)));
    app.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => { state.filter = b.dataset.filter; renderList(); }));
    app.querySelectorAll("[data-new]").forEach((b) => b.addEventListener("click", () => { state.form = { values: blankForm(b.dataset.new), existing: null }; renderForm(inst); window.scrollTo(0, 0); }));
    app.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => {
      const e = store.entries(inst.id).find((x) => x.id === b.dataset.edit);
      const s = (x) => x ?? "";
      state.form = { existing: e, values: { kind: e.kind, status: e.status === "open" ? "done" : e.status, title: e.title, performedAt: e.performedAt || today(), performedBy: LS.get(NAME_KEY) || e.performedBy, company: s(e.company), findings: e.findings, actions: e.actions, result: s(e.result), nextDueAt: s(e.nextDueAt), workPermitRef: s(e.workPermitRef), firmwareBefore: s(e.firmwareBefore), firmwareAfter: s(e.firmwareAfter) } };
      renderForm(inst); window.scrollTo(0, 0);
    }));
    app.querySelectorAll("[data-cancel]").forEach((b) => b.addEventListener("click", () => { state.form = null; render(); }));
    app.querySelectorAll("[data-unconfirm]").forEach((b) => b.addEventListener("click", () => { state.form.confirm = false; renderForm(inst); }));
    app.querySelectorAll("[data-confirm]").forEach((b) => b.addEventListener("click", () => {
      const f = state.form;
      try {
        store.save(toInput(inst, f.values, f.existing), f.existing);
        LS.set(NAME_KEY, f.values.performedBy.trim());
        state.form = null;
        render();
        toast(`Saved to ${esc(inst.functionalLocation)}. <a href="/twin">Open in digital twin</a>`);
      } catch (err) {
        if (err.conflict) {
          state.form = { existing: err.conflict, values: { ...f.values }, errors: { form: "" } };
          toast("This entry was changed in AutoTag meanwhile. Check and save again.");
          renderForm(inst);
        } else {
          toast(esc(err.message || "Could not save"));
        }
      }
    }));
  }

  document.getElementById("settingsBtn").addEventListener("click", () => {
    if (confirm("Demo mode: data is stored in this browser and shared with AutoTag on the same address.\n\nAPI mode (other devices) is not available in this build.\n\nReset the demo maintenance data?")) {
      store.reset(); state.form = null; render(); toast("Demo data reset.");
    }
  });

  fetch("registry.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(`registry.json: HTTP ${r.status}`); return r.json(); })
    .then((reg) => { REG = reg; store.read(); render(); })
    .catch((e) => { app.innerHTML = `<div class="card"><p class="title">Device register not available</p><p class="muted">${esc(e.message)}</p></div>`; });
})();
</script>
</body>
</html>
